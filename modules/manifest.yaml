schema: 1

# Stable source paths are kept for existing Raw subscriptions.
aggregate:
  path: modules/All-HTTPS-AdBlock.stoverride
  version: 1.0.14
  includes:
    - modules/Domestic-AdBlock.stoverride
    - modules/Bilibili-AppRewrite.stoverride
    - modules/Goofish-AppRewrite.stoverride
    - modules/JD-AppRewrite.stoverride
    - modules/QQNews-AppRewrite.stoverride
    - modules/Taobao-AppRewrite.stoverride
    - modules/Weibo-AppRewrite.stoverride
    - modules/Xiaohongshu-AppRewrite.stoverride
  inline:
    - id: ctrip
      reason: 携程规则目前仍在聚合模块中，待实机验证后拆分
    - id: zhihu
      reason: 知乎规则目前仍在聚合模块中，待实机验证后拆分
    - id: mijia
      reason: 米家开屏精确接口先在聚合模块中验证，确认稳定后再拆分
    - id: smzdm
      reason: 什么值得买开屏和首页响应改写先在聚合模块中验证，确认稳定后再拆分

modules:
