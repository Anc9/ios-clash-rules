rules:
- RULE-SET,cm-private,DIRECT
- RULE-SET,cm-privateip,DIRECT,no-resolve
- DOMAIN-SUFFIX,abchina.com.cn,DIRECT
- DOMAIN-SUFFIX,abchina.com,DIRECT
- DOMAIN-SUFFIX,msmp.abchina.com.cn,REJECT
- DOMAIN-SUFFIX,alipay.com,DIRECT
- DOMAIN-SUFFIX,alipayobjects.com,DIRECT
- DOMAIN-SUFFIX,tenpay.com,DIRECT
- DOMAIN-SUFFIX,unionpay.com,DIRECT
- DOMAIN-SUFFIX,95516.com,DIRECT
- DOMAIN-SUFFIX,apple.com,🍎 Apple
- DOMAIN-SUFFIX,apple.com.cn,🍎 Apple
- DOMAIN-SUFFIX,icloud.com,🍎 Apple
- DOMAIN-SUFFIX,itunes.com,🍎 Apple
- DOMAIN-SUFFIX,mzstatic.com,🍎 Apple
- DOMAIN-SUFFIX,cdn-apple.com,🍎 Apple
- RULE-SET,cm-apple-cn,🍎 Apple
- RULE-SET,cm-microsoft-cn,DIRECT
- RULE-SET,cm-netflix,🎬 流媒体
- RULE-SET,cm-disney,🎬 流媒体
- RULE-SET,cm-youtube,🎬 流媒体
- RULE-SET,cm-media,🎬 流媒体
- RULE-SET,cm-netflixip,🎬 流媒体,no-resolve
- RULE-SET,cm-mediaip,🎬 流媒体,no-resolve
# AI 域名的 UDP/QUIC 先拒绝，促使 iOS 回落到 HTTPS；不影响 Apple 等其他 UDP 流量
- AND,((DOMAIN-SUFFIX,openai.com),(NETWORK,udp)),REJECT
- AND,((DOMAIN-SUFFIX,chatgpt.com),(NETWORK,udp)),REJECT
- RULE-SET,cm-ai,🤖 AI 服务
- DOMAIN-SUFFIX,chatgpt.com,🤖 AI 服务
- DOMAIN-SUFFIX,openai.com,🤖 AI 服务
- DOMAIN-SUFFIX,claude.ai,🤖 AI 服务
- DOMAIN-SUFFIX,anthropic.com,🤖 AI 服务
- DOMAIN,gemini.google.com,🤖 AI 服务
- RULE-SET,cm-ads,🛡 广告拦截
- DOMAIN-SUFFIX,telegram.org,✈️ Telegram
- DOMAIN-SUFFIX,t.me,✈️ Telegram
- DOMAIN-SUFFIX,telegram.me,✈️ Telegram
- DOMAIN-SUFFIX,telegra.ph,✈️ Telegram
- DOMAIN-SUFFIX,telesco.pe,✈️ Telegram
- RULE-SET,cm-telegramip,✈️ Telegram,no-resolve
- RULE-SET,cm-proxy,🚀 代理选择
- RULE-SET,cm-cn,DIRECT
- RULE-SET,cm-cnip,DIRECT,no-resolve
- MATCH,🚀 代理选择
