# ClashRules / iOS 分流规则
# 版本: v2.2.9
# 作者: Anc9 (GitHub: https://github.com/Anc9)
# 更新日期: 2026-11-17
# 适用客户端: ProjectClash / Clash-Client (Mihomo)
# 这是「规则方案」文件：在配置库里选择本文件作为规则方案；原机场订阅继续作为节点来源。
# 顶层显示 6 个策略组；地区组设置 hidden: true，可从「🚀 代理选择」等入口访问。
# url-test 测的是访问 204 检测地址的延迟，不等于下载速度或 AI 服务解锁能力。
# 保留旧版规则集和路由；不包含节点、节点密码、订阅 URL 或机场 DNS。
# 注意：ProjectClash 的原始(Original)模式不会套用单独导入的规则方案。

mode: rule
proxy-groups:
- name: 🚀 代理选择
  type: select
  proxies:
  - 🇭🇰 香港自动
  - 🇯🇵 日本自动
  - 🇸🇬 新加坡自动
  - 🇺🇸 美国自动
  - 🇹🇼 台湾自动
  - 🌐 其他地区
  - ⚡ 全球自动
  - DIRECT
- name: 🤖 AI 服务
  type: select
  proxies:
  - 🤖 AI 自动
  - 🇭🇰 香港自动
  - 🇸🇬 新加坡自动
  - 🇯🇵 日本自动
  - 🇹🇼 台湾自动
  - 🇬🇧 英国自动
  - 🚀 代理选择
- name: 🤖 AI 自动
  type: fallback
  proxies:
  - 🇭🇰 香港自动
  - 🇸🇬 新加坡自动
  - 🇯🇵 日本自动
  - 🇹🇼 台湾自动
  - 🇬🇧 英国自动
  url: https://chatgpt.com/
  interval: 300
  timeout: 5000
  max-failed-times: 2
  lazy: false
  hidden: true
- name: ✈️ Telegram
  type: select
  proxies:
  - 🇭🇰 香港自动
  - 🇯🇵 日本自动
  - 🇹🇼 台湾自动
- name: 🍎 Apple
  type: select
  proxies:
  - 🍎 Apple 自动
  - DIRECT
  - 🇺🇸 美国自动
  - 🇭🇰 香港自动
  - 🚀 代理选择
- name: 🍎 Apple 自动
  type: fallback
  proxies:
  - DIRECT
  - 🇺🇸 美国自动
  url: https://apps.apple.com/
  interval: 300
  timeout: 5000
  max-failed-times: 2
  lazy: false
  hidden: true
- name: 🎬 流媒体
  type: select
  proxies:
  - 🇭🇰 香港自动
  - 🇯🇵 日本自动
  - 🇸🇬 新加坡自动
  - 🇺🇸 美国自动
  - 🚀 代理选择
- name: 🛡 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🌐 其他地区
  type: select
  hidden: true
  proxies:
  - 🇬🇧 英国自动
  - 🇦🇷 阿根廷自动
  - 🇷🇺 俄罗斯自动
  - 🇹🇷 土耳其自动
  - 🇰🇷 韩国自动
  - 🇮🇳 印度自动
  - 🇩🇪 德国自动
  - 🇨🇦 加拿大自动
  - 🇦🇺 澳大利亚自动
  - 🇫🇷 法国自动
  - 🇺🇦 乌克兰自动
- name: ⚡ 全球自动
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: true
  exclude-filter: (?i)免费|下载专用|x0[.]01|流量|到期|剩余|套餐|官网
  hidden: true
- name: 🇭🇰 香港自动
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: true
  exclude-filter: (?i)免费|下载专用|x0[.]01|流量|到期|剩余|套餐|官网
  filter: (?i)🇭🇰|香港|hong[ -]?kong|(^|[^a-z])hk([^a-z]|$)
  hidden: true
- name: 🇯🇵 日本自动
